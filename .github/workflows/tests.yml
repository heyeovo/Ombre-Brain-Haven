name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'backup_*/**'
      - '.gitignore'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run test suite
        run: python -m pytest tests -v --asyncio-mode=auto

  deploy-haven:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: haven-production-deploy
      cancel-in-progress: false
    steps:
      - name: Update the pinned Haven release SHA
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
          COOLIFY_WRITE_TOKEN: ${{ secrets.COOLIFY_WRITE_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          payload="$(jq -n --arg value "$RELEASE_SHA" '{key:"HAVEN_RELEASE_SHA", value:$value}')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "$COOLIFY_BASE_URL/api/v1/services/$COOLIFY_SERVICE_UUID/envs" \
            --header "Authorization: Bearer $COOLIFY_WRITE_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload"

      - name: Deploy the pinned Haven release
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$COOLIFY_SERVICE_UUID&force=false" \
            --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN"
